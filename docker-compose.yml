services:
  postgres:
    image: postgres:17
    container_name: brit-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: brit

    ports:
      - "5432:5432"

    volumes:
      - brit-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U root -d brit",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brit-postgres-data: